<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis-Recon Platform v4.0</title>
    <!-- Offline Libraries -->
    <script src="/static/js/vis-network.min.js"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="dashboard">
    <!-- Header -->
    <header class="glass-panel header">
        <div class="logo">
            <h1>Aegis-Recon</h1>
            <span class="badge">v4.0 (Air-Gapped)</span>
        </div>
        
        <div class="system-monitor" id="sys-monitor">
            <div class="stat">
                <span class="label">CPU</span>
                <span class="value" id="cpu-val">--%</span>
            </div>
            <div class="stat">
                <span class="label">RAM</span>
                <span class="value" id="ram-val">--%</span>
                <span class="sub-value" id="ram-mb">(-- / -- MB)</span>
            </div>
            <button id="btn-kill-switch" class="btn-danger">KILL SCANS</button>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="grid-container">
        
        <!-- Controls Panel -->
        <section class="glass-panel panel-controls">
            <h2>Reconnaissance Engine</h2>
            <div class="input-group">
                <label for="target-ip">Target IP / CIDR</label>
                <input type="text" id="target-ip" value="127.0.0.1" placeholder="e.g., 10.10.10.0/24">
            </div>
            <button id="btn-start-recon" class="btn-primary">
                <span class="icon">⚡</span> Start Recon
            </button>
            <div class="status-msg" id="recon-status">Ready</div>
        </section>

        <!-- Network Topology Panel -->
        <section class="glass-panel panel-topology">
            <h2>Network Topology</h2>
            <div id="vis-network-container"></div>
        </section>

        <!-- AI Advisor Panel -->
        <section class="glass-panel panel-ai">
            <h2><span class="icon">🤖</span> Junior Pentest Mentor</h2>
            <div class="ai-content" id="ai-output">
                <p class="placeholder-text">Awaiting scan results for analysis...</p>
            </div>
        </section>

    </main>
</div>

<script src="/static/js/topology.js"></script>
<script src="/static/js/app.js"></script>

</body>
</html>
